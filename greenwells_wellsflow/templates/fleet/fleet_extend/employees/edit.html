{% extends "layout.html" %}

{% block content %}
<div class="container mx-auto p-6 max-w-2xl">
  <!-- Glass Card Wrapper -->
  <div class="glass-card p-6 rounded-xl">
    <h3 class="text-2xl font-bold text-gray-800 mb-6">Edit Employee</h3>

    <form method="POST">
      <!-- First Name -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1.5">First Name</label>
        <input 
          type="text" 
          name="first_name" 
          class="w-full p-2 rounded-2xl bg-white/20 backdrop-blur-md border border-white/20 focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-800 text-sm"
          value="{{ emp['fname'] }}" 
          required
        >
      </div>

      <!-- Last Name -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Last Name</label>
        <input 
          type="text" 
          name="last_name" 
          class="w-full p-2 rounded-2xl bg-white/20 backdrop-blur-md border border-white/20 focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-800 text-sm"
          value="{{ emp['lname'] }}" 
          required
        >
      </div>

      <!-- Role -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Role</label>
        <input 
          type="text" 
          name="role" 
          class="w-full p-2 rounded-2xl bg-white/20 backdrop-blur-md border border-white/20 focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-800 text-sm"
          value="{{ emp['role'] }}" 
          required
        >
      </div>

      <!-- Email -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
        <input 
          type="email" 
          name="email" 
          class="w-full p-2 rounded-2xl bg-white/20 backdrop-blur-md border border-white/20 focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-800 text-sm"
          value="{{ emp['email'] }}" 
          required
        >
      </div>

      <!-- Phone Number -->
      <div class="mb-5">
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Phone Number (Optional)</label>
        <input 
          type="text" 
          name="phone_number" 
          class="w-full p-2 rounded-2xl bg-white/20 backdrop-blur-md border border-white/20 focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-800 text-sm"
          value="{{ emp['phone_number'] }}"
        >
      </div>

      <!-- Buttons -->
      <div class="flex gap-3 pt-2">
        <button type="submit" class="btn-glass px-5 py-2 bg-blue-600 hover:bg-blue-700 text-green-800 font-medium rounded-xl transition">
           Update Employee
        </button>
        <a href="{{ url_for('employees.employees_home') }}" class="btn-glass px-5 py-2 bg-gray-600 hover:bg-gray-700 text-green-800 font-medium rounded-xl transition">
          Cancel
        </a>
      </div>
    </form>
    <!-- Back Link -->
    <div class="text-center mt-5">
      <a href="{{ url_for('employees.employees_home') }}" class="text-blue-500 hover:underline text-sm font-medium">
        ← Back to Employee List
      </a>
    </div>
  </div>
</div>
{% endblock %}
